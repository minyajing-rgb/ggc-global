<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">生命周期与证据关口 / Lifecycle stages and evidence gates</title><desc id="desc">Framework illustration. Not historical company data or a universal organization chart.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7852a5" stroke-width="1.5"/></marker></defs>
<rect width="1160" height="720" fill="#fcf9f3"/>
<style>text{font-family:'Noto Sans SC','Noto Sans CJK SC','Noto Sans',Arial,sans-serif;fill:#24212c}.label{font-size:22px}.en{font-size:17px;fill:#625b6d}.small{font-size:15px;fill:#625b6d}.heading{font-family:'Noto Sans SC','Noto Sans CJK SC',Georgia,serif;font-size:31px}.accent{fill:#6940aa}</style>
<text x="48" y="43" class="small accent">FIGURE 03 · JOYCE MI / 艾小米 · GLOBAL GAME COPILOT</text>
<text x="48" y="91" class="heading">生命周期与证据关口</text><text x="48" y="124" class="en">Lifecycle stages and evidence gates</text>
<path d="M48 151H1112" stroke="#d8d0d8"/>
<rect x="48" y="198" width="332" height="163" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="68" y="235" class="label">01 假设与立项</text><text x="68" y="263" class="en">Hypothesis and greenlight</text><text x="68" y="349" class="small">用户问题与投入条件 / Problem &amp; investment</text><rect x="412" y="198" width="332" height="163" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="432" y="235" class="label">02 原型与体验</text><text x="432" y="263" class="en">Prototype and experience</text><text x="432" y="349" class="small">核心体验证据 / Core-experience evidence</text><rect x="776" y="198" width="332" height="163" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="796" y="235" class="label">03 市场测试</text><text x="796" y="263" class="en">Market testing</text><text x="796" y="349" class="small">留存、付费与成本 / Retention, payment, cost</text><rect x="48" y="406" width="332" height="163" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="68" y="443" class="label">06 更新或退出</text><text x="68" y="471" class="en">Renew or retire</text><text x="68" y="557" class="small">再投入的依据 / Reinvestment evidence</text><rect x="412" y="406" width="332" height="163" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="432" y="443" class="label">05 持续经营</text><text x="432" y="471" class="en">Live operations</text><text x="432" y="557" class="small">版本、经济与玩家关系 / Releases &amp; economy</text><rect x="776" y="406" width="332" height="163" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="796" y="443" class="label">04 发布与交接</text><text x="796" y="471" class="en">Launch and handover</text><text x="796" y="557" class="small">可用性与责任交接 / Readiness &amp; ownership</text><path d="M382 275L408 275" stroke="#7852a5" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M746 275L772 275" stroke="#7852a5" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M943 363L943 396" stroke="#7852a5" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M772 486L748 486" stroke="#7852a5" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M408 486L384 486" stroke="#7852a5" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><text x="48" y="635" class="small">每一关：提出假设 → 收集证据 → 决定继续、调整或停止。</text><text x="48" y="665" class="small">At each gate: hypothesis → evidence → continue, revise or stop. Stage criteria vary by product.</text></svg>
