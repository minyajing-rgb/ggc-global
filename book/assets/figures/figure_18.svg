<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">AI任务到可验收交付的证据链 / The evidence chain from AI tasks to accepted delivery</title><desc id="desc">Framework illustration. Not historical company data or a universal organization chart.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7852a5" stroke-width="1.5"/></marker></defs>
<rect width="1160" height="720" fill="#fcf9f3"/>
<style>text{font-family:'Noto Sans SC','Noto Sans CJK SC','Noto Sans',Arial,sans-serif;fill:#24212c}.label{font-size:22px}.en{font-size:17px;fill:#625b6d}.small{font-size:15px;fill:#625b6d}.heading{font-family:'Noto Sans SC','Noto Sans CJK SC',Georgia,serif;font-size:31px}.accent{fill:#6940aa}</style>
<text x="48" y="43" class="small accent">FIGURE 18 · JOYCE MI / 艾小米 · GLOBAL GAME COPILOT</text>
<text x="48" y="91" class="heading">AI任务到可验收交付的证据链</text><text x="48" y="124" class="en">The evidence chain from AI tasks to accepted delivery</text>
<path d="M48 151H1112" stroke="#d8d0d8"/>
<rect x="48" y="191" width="520" height="136" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="68" y="228" class="label">01 明确任务与交付物</text><text x="68" y="256" class="en">Define the task and deliverable</text><text x="68" y="315" class="small">使用者、目的、边界、验收 / User, purpose, scope, acceptance</text><rect x="588" y="191" width="520" height="136" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="608" y="228" class="label">02 工具、素材与权限</text><text x="608" y="256" class="en">Tools, source material and permissions</text><text x="608" y="315" class="small">确认能力与真实来源 / Verify capabilities and sources</text><path d="M571 260L583 260" stroke="#7852a5" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M850 330L850 360" stroke="#7852a5" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="588" y="366" width="520" height="136" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="608" y="403" class="label">03 生成、执行与验证</text><text x="608" y="431" class="en">Generate, execute and verify</text><text x="608" y="490" class="small">结果证据、失败处理与人工判断 / Evidence, failures, human judgment</text><rect x="48" y="366" width="520" height="136" rx="5" fill="#f1eaf7" stroke="#d4cbd9"/><text x="68" y="403" class="label">04 交付、反馈与修订</text><text x="68" y="431" class="en">Deliver, collect feedback and revise</text><text x="68" y="490" class="small">实际文件、链接、回执与版本 / Files, links, receipts, versions</text><path d="M583 435L571 435" stroke="#7852a5" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M312 361L312 334" stroke="#7852a5" fill="none" stroke-width="1.5" marker-end="url(#arrow)"/><text x="48" y="570" class="label">验收时问：交付在哪里？谁验证了？当前状态是什么？</text><text x="48" y="608" class="en">Acceptance questions: Where is the deliverable? Who verified it? What is its current status?</text><text x="48" y="663" class="small">未完成、被取消或缺少回执的步骤，保留真实状态。 / Preserve incomplete, cancelled and unverified states.</text></svg>
