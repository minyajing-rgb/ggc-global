<text x="65" y="192" class="small">决策 / DECISION</text><text x="605" y="192" class="small">牵头责任 / PROPOSED OWNER</text><rect x="48" y="212" width="520" height="84" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="68" y="249" class="label">阶段目标与取舍</text><text x="68" y="277" class="en">Stage goals and trade-offs</text><rect x="588" y="212" width="520" height="84" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="608" y="249" class="label">项目指定的决策负责人</text><text x="608" y="277" class="en">Product / business decision owner</text><rect x="48" y="310" width="520" height="84" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="68" y="347" class="label">研发可交付性</text><text x="68" y="375" class="en">Delivery feasibility</text><rect x="588" y="310" width="520" height="84" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="608" y="347" class="label">研发与制作负责人</text><text x="608" y="375" class="en">Engineering and production owners</text><rect x="48" y="408" width="520" height="84" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="68" y="445" class="label">玩家与经营假设</text><text x="68" y="473" class="en">Player and business hypotheses</text><rect x="588" y="408" width="520" height="84" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="608" y="445" class="label">运营与数据负责人</text><text x="608" y="473" class="en">Operations and data owners</text><rect x="48" y="506" width="520" height="84" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="68" y="543" class="label">上线与市场安排</text><text x="68" y="571" class="en">Launch and market readiness</text><rect x="588" y="506" width="520" height="84" rx="5" fill="#fffdf9" stroke="#d4cbd9"/><text x="608" y="543" class="label">发行、市场与平台负责人</text><text x="608" y="571" class="en">Publishing, marketing and platform owners</text><text x="48" y="651" class="small">示意表：实际项目需确认最终决策权、协作角色、截止日与验收标准。</text><text x="48" y="679" class="small">Illustrative only. Confirm authority, collaborators, deadlines and acceptance criteria for each project.</text></svg>
