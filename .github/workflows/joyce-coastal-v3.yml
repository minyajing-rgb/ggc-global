name: Joyce coastal website release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/coastal-transfer/*.b64'
      - 'scripts/build_coastal_v3.py'
      - 'scripts/qa_coastal_v3.py'
      - 'joyce/assets/coastal-v3.css'
      - 'joyce/assets/coastal-v3.js'
      - 'joyce/rate-card.csv'
      - 'joyce/content/capabilities.json'
      - 'joyce/content/advisory-scenarios.json'
      - '.github/workflows/joyce-coastal-v3.yml'

permissions:
  contents: write

concurrency:
  group: joyce-coastal-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore exact approved source and verify integrity
        run: |
          python - <<'PY'
          import base64, hashlib, io, zipfile
          from pathlib import Path
          parts=sorted(Path('scripts/coastal-transfer').glob('coastal-v3.part*.b64'))
          if parts:
              if len(parts)!=6:
                  raise RuntimeError('Expected all six transfer parts')
              payload=base64.b64decode(''.join(''.join(p.read_text().split()) for p in parts),validate=True)
              expected='6b324b4749d5e978a79c9fd00c23059ded308f07a6a3aea0108311ac2663d736'
              if hashlib.sha256(payload).hexdigest()!=expected:
                  raise RuntimeError('Source archive checksum mismatch')
              allowed={'scripts/build_coastal_v3.py','scripts/qa_coastal_v3.py','joyce/assets/coastal-v3.css','joyce/assets/coastal-v3.js','joyce/assets/coastal-portrait.avif','joyce/assets/coastal-panorama.avif','joyce/assets/sector-casino.avif','joyce/assets/sector-arcade.avif','joyce/assets/sector-sims.avif','joyce/assets/sector-wellbeing.avif'}
              with zipfile.ZipFile(io.BytesIO(payload)) as z:
                  if set(z.namelist())!=allowed or z.testzip():
                      raise RuntimeError('Archive integrity or path check failed')
                  for name in z.namelist():
                      target=Path(name)
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(z.read(name))
          if not Path('scripts/build_coastal_v3.py').is_file():
              raise RuntimeError('Build source is missing')
          Path('/tmp/rate-card.sha256').write_text(hashlib.sha256(Path('joyce/rate-card.csv').read_bytes()).hexdigest())
          PY
      - name: Build interactive website, not a PDF
        run: |
          python scripts/build_coastal_v3.py
          python - <<'PY'
          from pathlib import Path
          import hashlib
          assert hashlib.sha256(Path('joyce/rate-card.csv').read_bytes()).hexdigest()==Path('/tmp/rate-card.sha256').read_text(), 'Pricing source changed unexpectedly'
          assert Path('CNAME').read_text().strip()=='biz.ggcgames.com', 'Domain must be preserved'
          PY
      - name: Install browser QA
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test desktop, mobile, languages, prices and forms
        run: python scripts/qa_coastal_v3.py
      - name: Commit complete website to the Pages publishing branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html joyce/index.html joyce/rate-card.html scripts/build_coastal_v3.py scripts/qa_coastal_v3.py
          git add joyce/assets/coastal-v3.css joyce/assets/coastal-v3.js joyce/assets/coastal-portrait.avif joyce/assets/coastal-panorama.avif joyce/assets/sector-*.avif
          git add joyce/content/coastal-v3-manifest.json joyce/content/coastal-qa/
          git rm --ignore-unmatch scripts/coastal-transfer/coastal-v3.part*.b64
          if ! git diff --cached --quiet; then
            git commit -m 'feat: publish approved lavender-gold coastal website at both live entry points'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git rev-parse HEAD > joyce/content/coastal-qa/published-commit.txt
      - name: Archive tested website and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: joyce-coastal-v3-release
          path: |
            index.html
            CNAME
            .nojekyll
            joyce/index.html
            joyce/rate-card.html
            joyce/rate-card.csv
            joyce/assets/
            joyce/content/
            scripts/build_coastal_v3.py
            scripts/qa_coastal_v3.py
          retention-days: 7
      - name: Deployment handoff
        run: |
          echo 'Coastal website built, tested and committed to main. Check branch-based Pages deployment and live release marker separately before reporting the domain as updated.' >> "$GITHUB_STEP_SUMMARY"
