name: GGC PR11 product and performance review
on:
  push:
    branches: [feature/ggc-corporate-rebuild-20261010]
    paths:
      - 'corporate/fullsite-v4/**'
      - '.github/workflows/ggc-pr11-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ggc-pr11-performance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    if: github.ref == 'refs/heads/feature/ggc-corporate-rebuild-20261010'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review dependencies
        run: |
          python -m pip install playwright==1.57.0 beautifulsoup4 Pillow
          python -m playwright install --with-deps chromium
      - name: Compare source-only candidates, behavior, paint and performance
        run: python corporate/fullsite-v4/qa/review_performance.py
      - name: Save evidence and optimized candidate (not a deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ggc-pr11-product-performance
          path: |
            performance-evidence/review.json
            performance-evidence/candidate/
            performance-evidence/*.png
          retention-days: 14
          if-no-files-found: error
