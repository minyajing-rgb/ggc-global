<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GGC Casino Game Classification Atlas 2026</title><style>body{margin:0;background:#f8f5ff;color:#2d2540;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:620px;padding:32px;border:1px solid #e1ca93;border-radius:18px;background:#fff;box-shadow:0 12px 32px rgba(83,62,120,.08)}h1{font-family:Georgia,serif;margin:0 0 10px;color:#6953a3}p{line-height:1.6;color:#665e70}</style></head><body><div class="box"><h1>GGC Casino Game Classification Atlas 2026</h1><p>Loading the classification atlas…</p></div><script>(async()=>{try{const base='assets/GGC_Casino_Game_Classification_Atlas_2026_v2.part';const files=[1,2,3,4].map(i=>fetch(base+i+'.b64').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}));const parts=await Promise.all(files);const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const html=new TextDecoder('utf-8').decode(bytes);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h1>Atlas load error</h1><p>'+String(e)+'</p></div>'}})();</script></body></html>
